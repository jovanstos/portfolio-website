services:
  app:
    build:
      context: .
      dockerfile: dockerfile
      target: development
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5174:5174"
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      CLIENT_ORIGIN: http://localhost:5174
      TRUST_PROXY_HOPS: "0"
    init: true
